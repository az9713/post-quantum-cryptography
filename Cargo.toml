[package]
name = "post-quantum-cryptography"
version = "0.1.0"
edition = "2021"
description = "Educational demonstration of WOTS+ post-quantum signatures with comprehensive tutorials"
license = "MIT"
readme = "README.md"
repository = "https://github.com/az9713/post-quantum-cryptography"

[dependencies]
# Cryptographic primitives
blake3 = "1.5"
sha3 = "0.10"
hex = "0.4"
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Pretty terminal output
colored = "2.0"

[dev-dependencies]
# Testing

[features]
default = []

[[bin]]
name = "pqc-demo"
path = "src/main.rs"
